backend:
  name: github
  branch: main
  repo: thepinkhacker/easypeasy
  site_domain: aiwithease.net
  base_url: https://aiwithease.net
  auth_endpoint: oauth

publish_mode: editorial_workflow

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    media_folder: "../../assets/blog"
    public_folder: "../../assets/blog"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Publish Date", name: "publishDate", widget: "datetime", picker_utc: true }
      - { label: "Updated Date", name: "updatedDate", widget: "datetime", picker_utc: true, required: false }
      - { label: "Cover Image", name: "cover", widget: "image" }
      - { label: "Cover Image Alt Text", name: "coverAlt", widget: "string" }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Body", name: "body", widget: "markdown" }
